name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sibling Civs checkout for system-scoped JAR (optional until CI builds Civs)
          path: rpg-server-plugin

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Checkout Civs dependency
        uses: actions/checkout@v4
        with:
          repository: Daniel730/Civs
          # master includes Paper 26.1.2 events RPG compiles against; phase0 branch
          # still pins MythicLib 1.6.1 / nocheatplus v1.5 which do not resolve on CI
          ref: master
          path: Civs-1.11.6

      # NoCheatPlus is not resolvable from public Maven (JitPack flake); seed local .m2
      # the same way README / AGENTS.md document for local builds.
      - name: Install Civs build stubs (NoCheatPlus)
        run: |
          mkdir -p /tmp/ncp
          curl -fsSL -o /tmp/ncp/NoCheatPlus.jar \
            https://github.com/Updated-NoCheatPlus/NoCheatPlus/releases/download/v1.5/NoCheatPlus.jar
          cat > /tmp/ncp/ncp-clean-pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.github.Updated-NoCheatPlus.NoCheatPlus</groupId>
            <artifactId>nocheatplus</artifactId>
            <version>1.5</version>
            <packaging>jar</packaging>
          </project>
          EOF
          mvn -B -q install:install-file -Dfile=/tmp/ncp/NoCheatPlus.jar -DpomFile=/tmp/ncp/ncp-clean-pom.xml
          # Some Civs docs also reference fr.neatmonster:ncpplugin — install same JAR under that coord if needed
          cat > /tmp/ncp/ncpplugin-pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>fr.neatmonster</groupId>
            <artifactId>ncpplugin</artifactId>
            <version>1.1-SNAPSHOT</version>
            <packaging>jar</packaging>
          </project>
          EOF
          mvn -B -q install:install-file -Dfile=/tmp/ncp/NoCheatPlus.jar -DpomFile=/tmp/ncp/ncpplugin-pom.xml

      - name: Build Civs JAR
        working-directory: Civs-1.11.6
        run: |
          mvn -B -q -DskipTests package
          test -f target/civs-1.11.7.jar || test -f target/civs-1.11.6.jar
          if [ ! -f target/civs-1.11.7.jar ] && [ -f target/civs-1.11.6.jar ]; then
            cp target/civs-1.11.6.jar target/civs-1.11.7.jar
          fi

      - name: Test RPG
        working-directory: rpg-server-plugin
        run: mvn -B test

      - name: JaCoCo (when plugin configured)
        working-directory: rpg-server-plugin
        continue-on-error: true
        run: mvn -B jacoco:report

      - name: Upload coverage to Codecov
        if: hashFiles('rpg-server-plugin/target/site/jacoco/jacoco.xml') != ''
        uses: codecov/codecov-action@v4
        with:
          files: rpg-server-plugin/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  conventional-title:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
          requireScope: false
